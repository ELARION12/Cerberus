<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340">
  <defs>
    <!-- Dark Metallic Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#151c33" />
    </linearGradient>

    <!-- Neon Cyan Core Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Neon Green Accents -->
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)" />

  <!-- Horizontal Tech Lines -->
  <path d="M0 170 L380 170 L430 200 L550 200" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path d="M1280 170 L900 170 L850 200 L730 200" fill="none" stroke="#1E293B" stroke-width="2"/>
  <circle cx="380" cy="170" r="4" fill="#00F2FE" />
  <circle cx="900" cy="170" r="4" fill="#38EF7D" />

  <!-- Center Metallic Core Emblem -->
  <g transform="translate(640, 115)">
    <!-- Outer Hexagon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#090E17" stroke="url(#cyan-glow)" stroke-width="3.5" filter="url(#glow-cyan)"/>
    <!-- Inner Hexagon -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="none" stroke="url(#green-glow)" stroke-width="2" filter="url(#glow-green)"/>
    
    <!-- Central Iron Anvil / Lightning Core -->
    <path d="M-18 12 L0 -20 L18 12 M-12 2 L12 2" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="640" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">IRONAGENT</text>
  <text x="640" y="250" font-family="monospace" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="4">BARE-METAL AI AGENT ENGINE • V1.4.0</text>

  <!-- Feature Badges -->
  <g transform="translate(360, 280)">
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#0F172A" stroke="#00F2FE" stroke-width="1.2"/>
    <text x="80" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FE" text-anchor="middle">⚡ 270K ITER/SEC</text>
  </g>
  <g transform="translate(535, 280)">
    <rect x="0" y="0" width="210" height="28" rx="6" fill="#0F172A" stroke="#38EF7D" stroke-width="1.2"/>
    <text x="105" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#38EF7D" text-anchor="middle">🧠 ZERO-COPY KV ARENA</text>
  </g>
  <g transform="translate(760, 280)">
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="80" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#F59E0B" text-anchor="middle">📍 HNSW SQ8 SIMD</text>
  </g>
</svg>
